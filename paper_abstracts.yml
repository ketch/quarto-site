munoz2023comparative:
  arxiv: '2209.12235'
  abstract: The Riemann problem for first-order hyperbolic systems of partial differential equations is of fundamental importance for both theoretical and numerical purposes. Many approximate solvers have been developed for such systems; exact solution algorithms have received less attention because computation of the exact solution typically requires iterative solution of algebraic equations. Iterative algorithms may be less computationally efficient or might fail to converge in some cases. We investigate the achievable efficiency of robust iterative Riemann solvers for relatively simple systems, focusing on the shallow water and Euler equations. We consider a range of initial guesses and iterative schemes applied to an ensemble of test Riemann problems. For the shallow water equations, we find that Newton's method with a simple modification converges quickly and reliably. For the Euler equations we obtain similar results; however, when the required precision is high, a combination of Ostrowski and Newton iterations converges faster. These solvers are slower than standard approximate solvers like Roe and HLLE, but come within a factor of two in speed. We also provide a preliminary comparison of the accuracy of a finite volume discretization using an exact solver versus standard approximate solvers.
munoz2026adaptive:
  arxiv: '2606.12162'
  abstract: Accurate modeling of tsunamis (such as those generated by landslides) requires capturing both wave dispersion in the deep ocean and wave breaking near the shore. The shallow water equations are often preferred for working with tsunamis, but neglect dispersion and may be inaccurate in scenarios where dispersive effects are significant. In this work, we develop an approach that seeks to incorporate the best aspects of both hyperbolic and dispersive models by combining either of two hyperbolic reformulations of the Serre-Green-Naghdi equations away from the shore with the non-dispersive shallow water equations near the shore. The model is discretized and implemented within the GeoClaw software, and incorporates adaptive mesh refinement as well as shared-memory parallelism. We validate it through comparison with benchmarks and real tsunami data. The results and performance compare favorably with the existing dispersive water wave solvers, including a speedup of about 2x relative to GeoClaw's existing dispersive solver for a large-scale tsunami simulation.
munoz2026hyperbolic:
  arxiv: '2611.03642'
  abstract: We propose and study a first-order hyperbolic approximation of the nonlinear Schrödinger (NLS) equation in $N$ spatial dimensions. This is an extension of the recently-proposed 1D hyperbolic NLS model. We study the structure and properties of the hyperbolic approximation and their relation to those of the original system. We show that the N-dimensional hyperbolic system exactly conserves analogs of the mass, energy, and momentum, and that it possesses stationary solutions that are closely related to those of NLS. The hyperbolic system is also shown to admit plane-wave solutions that share some stability properties with those of NLS, and that relaxation can shrink the focusing low-wavenumber modulational instability band as well as introduce a high-wavenumber instability band not present in NLS. We also show that solutions of the hyperbolic system converge to solutions of NLS in the relaxation limit. We present an adaptive-mesh finite volume discretization of the hyperbolic system and demonstrate its effectiveness in handling simulations, including those with geometric obstacles or non-periodic boundary conditions. The effectiveness of the numerical scheme is demonstrated through examples including a Bose-Einstein condensate, line soliton instability, and superflow past a cylinder.
nusslein2021positivity:
  arxiv: '2005.06268'
  abstract: Many important differential equations model quantities whose value must remain positive or stay in some bounded interval. These bounds may not be preserved when the model is solved numerically. We propose to ensure positivity or other bounds by applying Runge-Kutta integration in which the method weights are adapted in order to enforce the bounds. The weights are chosen at each step after calculating the stage derivatives, in a way that also preserves (when possible) the order of accuracy of the method. The choice of weights is given by the solution of a linear program. We investigate different approaches to choosing the weights by considering adding further constraints. We also provide some analysis of the properties of Runge-Kutta methods with perturbed weights. Numerical examples demonstrate the effectiveness of the approach, including application to both stiff and non-stiff problems.
