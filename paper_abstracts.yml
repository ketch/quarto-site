alamri2024very:
  arxiv: '2211.14574'
  abstract: A numerical search approach is used to design high-order diagonally implicit Runge-Kutta (DIRK) schemes equipped with embedded error estimators, some of which have identical diagonal elements (SDIRK) and explicit first stage (ESDIRK). In each of these classes, we present new A-stable schemes of order six (the highest order of previously known A-stable DIRK-type schemes) up to order eight. For each order, we include one scheme that is only A-stable as well as schemes that are L-stable, stiffly accurate, and/or have stage order two. The latter types require more stages, but give better convergence rates for differential-algebraic equations (DAEs), and those which have stage order two give better accuracy for moderately stiff problems. The development of the eighth-order schemes requires, in addition to imposing A-stability, finding highly accurate numerical solutions for a system of 200 equations in over 100 variables, which is accomplished via a combination of global and local optimization strategies. The accuracy, stability, and adaptive stepsize control of the schemes are demonstrated on diverse problems.
avram2021review:
  arxiv: '2106.00384'
  abstract: Many of the models used nowadays in mathematical epidemiology, in particular in COVID-19 research, belong to a certain sub-class of compartmental models whose classes may be divided into three "(x, y, z)" groups, which we will call respectively "susceptible/entrance, diseased, and output" (in the classic SIR case, there is only one class of each type). Roughly, the ODE dynamics of these models contain only linear terms, with the exception of products between x and y terms. It has long been noticed that the basic reproduction number R has a very simple formula (3.3) in terms of the matrices which define the model, and an explicit first integral formula (3.8) is also available. These results can be traced back at least to [ABvdD+07] and [Fen07], respectively, and may be viewed as the "basic laws of SIR-type epidemics"; however many papers continue to reprove them in particular instances (by the next-generation matrix method or by direct computations, which are unnecessary). This motivated us to redraw the attention to these basic laws and provide a self-contained reference of related formulas for (x, y, z) models. We propose to rebaptize the class to which they apply as matrix SIR epidemic models, abbreviated as SYR, to emphasize the similarity to the classic SIR case. For the case of one susceptible class, we propose to use the name SIR-PH, due to a simple probabilistic interpretation as SIR models where the exponential infection time has been replaced by a PH-type distribution. We note that to each SIR-PH model, one may associate a scalar quantity Y(t) which satisfies "classic SIR relations", see (3.8). In the case of several susceptible classes, this generalizes to (5.10); in a future paper, we will show that (3.8), (5.10) may be used to obtain approximate control policies which compare well with the optimal control of the original model.
barrios2025pseudo:
  arxiv: '2407.15365'
  abstract: Using a recent characterization of energy-preserving B-series, we derive the explicit conditions on the coefficients of a Runge-Kutta method that ensure energy preservation (for Hamiltonian systems) up to a given order in the step size, which we refer to as the pseudo-energy-preserving (PEP) order. We study explicit Runge-Kutta methods with PEP order higher than their classical order. We provide examples of such methods up to PEP order six, and test them on Hamiltonian ODE and PDE systems. We find that these methods behave similarly to exactly energy-conservative methods over moderate time intervals and exhibit significantly smaller errors, relative to other Runge-Kutta methods of the same order, for moderately long-time simulations.
biswas2023design:
  arxiv: '2204.11264'
  abstract: Runge-Kutta (RK) methods may exhibit order reduction when applied to certain stiff problems. While fully implicit RK schemes exist that avoid order reduction via high-stage order, DIRK (diagonally implicit Runge-Kutta) schemes are practically important due to their structural simplicity; however, these cannot possess high stage order. The concept of weak stage order (WSO) can also overcome order reduction, and it is compatible with the DIRK structure. DIRK schemes of WSO up to 3 have been proposed in the past, however, based on a simplified framework that cannot be extended beyond WSO 3. In this work a general theory of WSO is employed to overcome the prior WSO barrier and to construct practically useful high-order DIRK schemes with WSO 4 and above. The resulting DIRK schemes are stiffly accurate, L-stable, have optimized error coefficients, and are demonstrated to perform well on a portfolio of relevant ODE and PDE test problems.
biswas2023multiple:
  arxiv: '2302.05235'
  abstract: We generalize the idea of relaxation time stepping methods in order to preserve multiple nonlinear conserved quantities of a dynamical system by projecting along directions defined by multiple time stepping algorithms. Similar to the directional projection method of Calvo et. al., we use embedded Runge-Kutta methods to facilitate this in a computationally efficient manner. Proof of the accuracy of the modified RK methods and the existence of valid relaxation parameters are given, under some restrictions. Among other examples, we apply this technique to Implicit-Explicit Runge-Kutta time integration for the Korteweg-de Vries equation and investigate the feasibility and effect of conserving multiple invariants for multi-soliton solutions.
biswas2024accurate:
  arxiv: '2309.02324'
  abstract: The nonlinear Schrödinger (NLS) equation possesses an infinite hierarchy of conserved densities and the numerical preservation of some of these quantities is critical for accurate long-time simulations, particularly for multi-soliton solutions. We propose an essentially explicit discretization that conserves one or two of these conserved quantities by combining higher-order Implicit-Explicit (ImEx) Runge-Kutta time integrators with the relaxation technique and adaptive step size control. We show through numerical tests that our mass-conserving method is much more efficient and accurate than the widely-used 2nd-order time-splitting pseudospectral approach. Compared to higher-order operator splitting, it gives similar results in general and significantly better results near the semi-classical limit. Furthermore, for some problems adaptive time stepping provides a dramatic reduction in cost without sacrificing accuracy. We also propose a full discretization that conserves both mass and energy by using a conservative finite element spatial discretization and multiple relaxation in time. Our results suggest that this method provides a qualitative improvement in long-time error growth for multi-soliton solutions.
biswas2024algebraic:
  arxiv: '2204.03603'
  abstract: Runge-Kutta (RK) methods may exhibit order reduction when applied to stiff problems. For linear problems with time-independent operators, order reduction can be avoided if the method satisfies certain weak stage order (WSO) conditions, which are less restrictive than traditional stage order conditions. This paper outlines the first algebraic theory of WSO, and establishes general order barriers that relate the WSO of a RK scheme to its order and number of stages for both fully-implicit and DIRK schemes. It is shown in several scenarios that the constructed bounds are sharp. The theory characterizes WSO in terms of orthogonal invariant subspaces and associated minimal polynomials. The resulting necessary conditions on the structure of RK methods with WSO are then shown to be of practical use for the construction of such schemes.
biswas2025explicit:
  arxiv: '2310.02817'
  abstract: Explicit Runge--Kutta (RK) methods are susceptible to a reduction in the observed order of convergence when applied to initial-boundary value problem with time-dependent boundary conditions. We study conditions on explicit RK methods that guarantee high-order convergence for linear problems; we refer to these conditions as weak stage order conditions. We prove a general relationship between the method's order, weak stage order, and number of stages. We derive explicit RK methods with high weak stage order and demonstrate, through numerical tests, that they avoid the order reduction phenomenon up to any order for linear problems and up to order three for nonlinear problems.
biswas2025hyperbolic:
  arxiv: '2505.21424'
  abstract: "We study a first-order hyperbolic approximation of\n  the nonlinear Schrödinger (NLS) equation. We show that the system\n  is strictly hyperbolic and possesses a modified Hamiltonian structure, along with\n  at least three conserved quantities that approximate those of NLS.\n  We provide families of explicit standing-wave solutions to the hyperbolic system,\n  which are shown to converge uniformly to ground-state solutions\n  of NLS in the relaxation limit.\n  The system is formally equivalent to NLS in the relaxation limit, and we\n  develop asymptotic preserving discretizations that tend to a consistent discretization\n  of NLS in that limit, while also conserving mass.\n  Examples for both the focusing and defocusing regimes demonstrate that the\n  numerical discretization provides an accurate approximation of the NLS\n  solution."
biswas2025traveling:
  arxiv: '2412.17117'
  abstract: We study the recently-proposed hyperbolic approximation of the Korteweg-de Vries equation (KdV). We show that this approximation, which we call KdVH, possesses a rich variety of solutions, including solitary wave solutions that approximate KdV solitons, as well as other solitary and periodic solutions that are related to higher-order water wave models, and may include singularities. We analyze a class of implicit-explicit Runge-Kutta time discretizations for KdVH that are asymptotic preserving, energy conserving, and can be applied to other hyperbolized systems. We also develop structure-preserving spatial discretizations based on summation-by-parts operators in space including finite difference, discontinuous Galerkin, and Fourier methods. We use the entropy relaxation approach to make the fully discrete schemes energy-preserving. Numerical experiments demonstrate the effectiveness of these discretizations.
biswas2026asymptotic:
  arxiv: '2609.22864'
  abstract: We study the application of exponential time integration methods, coupled with Fourier pseudospectral space discretization, to the hyperbolic Korteweg-de Vries (KdVH) system. We investigate the asymptotic preserving (AP) properties of such discretizations, showing that, in general, Lawson methods are not asymptotic preserving, because the auxiliary (derivative-approximating) variables do not satisfy the limit equilibrium manifold, whereas exponential time differencing (ETD) methods are AP for all components, including both the solution variable and the auxiliary variables. We also present an efficient numerical implementation based on an exact formula for the matrix exponential of this system, and compare it with previously-proposed ImEx Runge-Kutta time integration, showing that exponential methods can be competitive in this context.
bleecke2025asymptotic:
  arxiv: '2511.10044'
  abstract: We study the hyperbolic approximation of the Benjamin-Bona-Mahony (BBM) equation proposed recently by Gavrilyuk and Shyue (2022). We develop asymptotic-preserving numerical methods using implicit-explicit (additive) Runge-Kutta methods that are implicit in the stiff linear part. The new discretization of the hyperbolization conserves important invariants converging to invariants of the BBM equation. We use the entropy relaxation approach to make the fully discrete schemes energy-preserving. Numerical experiments demonstrate the effectiveness of these discretizations.
busaleh2024homogenized:
  arxiv: '2410.05176'
  abstract: We analyze the behavior of an isentropic gas in a narrow pipe with periodically-varying cross-sectional area. Using multiple-scale perturbation theory, we derive homogenized effective equations, which take the form of a constant-coefficient system of evolution equations, including dispersive higher-order derivative terms. We provide an approximate Riemann solver for the variable-cross-section isentropic gas equations, and compare numerical solutions of the original system with those of the homogenized system. We observe that the resulting solutions take the form of solitary waves, rather than shock waves, under fairly general conditions.
hadjimichael2021positivity:
  arxiv: '2105.07403'
  abstract: We analyze, from the viewpoint of positivity preservation, certain discretizations of a fundamental partial differential equation, the one-dimensional advection equation with periodic boundary condition. The full discretization is obtained by coupling a finite difference spatial semi-discretization (the second- and some higher-order centered difference schemes, or the Fourier spectral collocation method) with an arbitrary $θ$-method in time (including the forward and backward Euler methods, and a second-order method by choosing $θ\in [0,1]$ suitably). The full discretization generates a two-parameter family of circulant matrices $M\in\mathbb{R}^{m\times m}$, where each matrix entry is a rational function in $θ$ and $ν$. Here, $ν$ denotes the CFL number, being proportional to the ratio between the temporal and spatial discretization step sizes. The entrywise non-negativity of the matrix $M$ -- which is equivalent to the positivity preservation of the fully discrete scheme -- is investigated via discrete Fourier analysis and also by solving some low-order parametric linear recursions. We find that positivity preservation of the fully discrete system is impossible if the number of spatial grid points $m$ is even. However, it turns out that positivity preservation of the fully discrete system is recovered for \emph{odd} values of $m$ provided that $θ\ge 1/2$ and $ν$ are chosen suitably. These results are interesting since the systems of ordinary differential equations obtained via the spatial semi-discretizations studied are \emph{not} positivity preserving.
internal_stability_report:
  arxiv: '1309.1317'
  abstract: In practical computation with Runge--Kutta methods, the stage equations are not satisfied exactly, due to roundoff errors, algebraic solver errors, and so forth. We show by example that propagation of such errors within a single step can have catastrophic effects for otherwise practical and well-known methods. We perform a general analysis of internal error propagation, emphasizing that it depends significantly on how the method is implemented. We show that for a fixed method, essentially any set of internal stability polynomials can be obtained by modifying the implementation details. We provide bounds on the internal error amplification constants for some classes of methods with many stages, including strong stability preserving methods and extrapolation methods. These results are used to prove error bounds in the presence of roundoff or other internal errors.
izgin2025order:
  arxiv: '2305.14297'
  abstract: In recent years, many positivity-preserving schemes for initial value problems have been constructed by modifying a Runge--Kutta (RK) method by weighting the right-hand side of the system of differential equations with solution-dependent factors. These include the classes of modified Patankar--Runge--Kutta (MPRK) and Geometric Conservative (GeCo) methods. Compared to traditional RK methods, the analysis of accuracy and stability of these methods is more complicated. In this work, we provide a comprehensive and unifying theory of order conditions for such RK-like methods, which differ from original RK schemes in that their coefficients are solution-dependent. The resulting order conditions are themselves solution-dependent and obtained using the theory of NB-series, and thus, can easily be read off from labeled N-trees. We present for the first time order conditions for MPRK and GeCo schemes of arbitrary order; For MPRK schemes, the order conditions are given implicitly in terms of the stages. From these results, we recover as particular cases all known order conditions from the literature for first- and second-order GeCo as well as first-, second- and third-order MPRK methods. Additionally, we derive sufficient and necessary conditions in an explicit form for 3rd and 4th order GeCo schemes as well as 4th order MPRK methods. We also present a new 4th order MPRK method within this framework and numerically confirm its convergence rate.
jensen2026optimized:
  arxiv: '2610.22685'
  abstract: We design and test several new optimized linear multistep methods for stiff problems. Each method is A-stable, implicit, and second-order accurate. We focus on achieving the smallest possible error constant while also ensuring that stiff modes are damped. We recover some known optimal L-stable three- and four-step methods, and provide new and improved five-step methods. We also develop new methods that are not L-stable but provide a prescribed rate of damping in the infinitely stiff limit. Variable-step-size formulae are also provided for some of the new methods. Numerical tests demonstrate that the improved error constants lead to improved accuracy.
