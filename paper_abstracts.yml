2020_relaxation:
  arxiv: '2003.03012'
  abstract: Recently, an approach known as relaxation has been developed for preserving the correct evolution of a functional in the numerical solution of initial-value problems, using Runge-Kutta methods. We generalize this approach to multistep methods, including all general linear methods of order two or higher, and many other classes of schemes. We prove the existence of a valid relaxation parameter and high-order accuracy of the resulting method, in the context of general equations, including but not limited to conservative or dissipative systems. The theory is illustrated with several numerical examples.
2021_solitary:
  arxiv: '1907.07094'
  abstract: We study the flow of water waves over bathymetry that varies periodically along one direction. We derive a linearized, homogenized model and show that the periodic bathymetry induces an effective dispersion, distinct from the dispersion inherently present in water waves. We relate this dispersion to the well-known effective dispersion introduced by changes in the bathymetry in non-rectangular channels. Numerical simulations using the (non-dispersive) shallow water equations reveal that a balance between this effective dispersion and nonlinearity can create solitary waves. We derive a KdV-type equation that approximates the behavior of these waves in the weakly-nonlinear regime. We show that, depending on geometry, dispersion due to bathymetry can be much stronger than traditional water wave dispersion and can prevent wave breaking in strongly nonlinear regimes. Computational experiments using depth-averaged water wave models %, as well as confirm the analysis and suggest that experimental observation of these solitary waves is possible.
2025_Euler_homogenization:
  arxiv: '2412.11086'
  abstract: We study the behavior of perturbations in a compressible one-dimensional inviscid gas with an ambient state consisting of constant pressure and periodically-varying density. We show through asymptotic analysis that long-wavelength perturbations approximately obey a system of dispersive nonlinear wave equations. Computational experiments demonstrate that solutions of the 1D Euler equations agree well with this dispersive model, with solutions consisting mainly of solitary waves. Shock formation seems to be avoided for moderate-amplitude initial data, while shock formation occurs for larger initial data. We investigate the threshold for transition between these behaviors, validating a previously-proposed criterion based on further computational experiments. These results support the existence of large-time non-breaking solutions to the 1D compressible Euler equations, as hypothesized in previous works.
2025_hyperbolization:
  arxiv: '2405.16841'
  abstract: We present a framework for constructing a first-order hyperbolic system whose solution approximates that of a desired higher-order evolution equation. Constructions of this kind have received increasing interest in recent years, and are potentially useful as either analytical or computational tools for understanding the corresponding higher-order equation. We perform a systematic analysis of a family of linear model equations and show that for each member of this family there is a stable hyperbolic approximation whose solution converges to that of the model equation in a certain limit. We then show through several examples that this approach can be applied successfully to a very wide range of nonlinear PDEs of practical interest.
2025_sw1d_homogenization:
  arxiv: '2311.02603'
  abstract: We study the behavior of shallow water waves over periodically-varying bathymetry, based on the first-order hyperbolic Saint-Venant equations. Although solutions of this system are known to generally exhibit wave breaking, numerical experiments suggest a different behavior in the presence of periodic bathymetry. Starting from the first-order variable-coefficient hyperbolic system, we apply a multiple-scale perturbation approach in order to derive a system of constant-coefficient high-order partial differential equations whose solution approximates that of the original system. The high-order system turns out to be dispersive and exhibits solitary-wave formation, in close agreement with direct numerical simulations of the original system. We show that the constant-coefficient homogenized system can be used to study the properties of solitary waves and to conduct efficient numerical simulations.
2025_sw2d_homogenization:
  arxiv: '2409.00076'
  abstract: We study the behavior of shallow water waves propagating over bathymetry that varies periodically in one direction and is constant in the other. Plane waves traveling along the constant direction are known to evolve into solitary waves, due to an effective dispersion. We apply multiple-scale perturbation theory to derive an effective constant-coefficient system of equations, showing that the transversely-averaged wave approximately satisfies a Boussinesq-type equation, while the lateral variation in the wave is related to certain integral functions of the bathymetry. Thus the homogenized equations not only accurately describe these waves but also predict their full two-dimensional shape in some detail. Numerical experiments confirm the good agreement between the effective equations and the variable-bathymetry shallow water equations.
