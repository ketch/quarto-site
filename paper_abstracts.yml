2018_wso:
  arxiv: '1811.01285'
  abstract: 'Runge-Kutta time-stepping methods in general suffer from order reduction: the observed order of convergence may be less than the formal order when applied to certain stiff problems. Order reduction can be avoided by using methods with high stage order. However, diagonally-implicit Runge-Kutta (DIRK) schemes are limited to low stage order. In this paper we explore a weak stage order criterion, which for initial boundary value problems also serves to avoid order reduction, and which is compatible with a DIRK structure. We provide specific DIRK schemes of weak stage order up to 3, and demonstrate their performance in various examples.'
2019_DNStime:
  arxiv: '1810.10197'
  abstract: Time integration of Fourier pseudo-spectral DNS is usually performed using the classical fourth-order accurate Runge--Kutta method, or other methods of second or third order, with a fixed step size. We investigate the use of higher-order Runge-Kutta pairs and automatic step size control based on local error estimation. We find that the fifth-order accurate Runge--Kutta pair of Bogacki \& Shampine gives much greater accuracy at a significantly reduced computational cost. Specifically, we demonstrate speedups of 2x-10x for the same accuracy. Numerical tests (including the Taylor-Green vortex, Rayleigh-Taylor instability, and homogeneous isotropic turbulence) confirm the reliability and efficiency of the method. We also show that adaptive time stepping provides a significant computational advantage for some problems (like the development of a Rayleigh-Taylor instability) without compromising accuracy.
2019_characteristics:
  arxiv: '1901.04158'
  abstract: A new method of solution is proposed for solution of the wave equation in one space dimension with continuously-varying coefficients. By considering all paths along which information arrives at a given point, the solution is expressed as an infinite series of integrals, where the integrand involves only the initial data and the PDE coefficients. Each term in the series represents the influence of paths with a fixed number of turning points. We prove that the series converges and provide bounds for the truncation error. The effectiveness of the approximation is illustrated with examples. We illustrate an interesting combinatorial connection between the traditional reflection and transmission coefficients for a sharp interface, and Green's coefficient for transmission through a smoothly-varying region.
2019_energyRRK:
  arxiv: '1905.09847'
  abstract: We further develop a simple modification of Runge--Kutta methods that guarantees conservation or stability with respect to any inner-product norm. The modified methods can be explicit and retain the accuracy and stability properties of the unmodified Runge--Kutta method. We study the properties of the modified methods and show their effectiveness through numerical examples, including application to entropy-stability for first-order hyperbolic PDEs.
2019_energystability:
  arxiv: '1909.13215'
  abstract: Many important initial value problems have the property that energy is non-increasing in time. Energy stable methods, also referred to as strongly stable methods, guarantee the same property discretely. We investigate requirements for conditional energy stability of explicit Runge-Kutta methods for nonlinear or non-autonomous problems. We provide both necessary and sufficient conditions for energy stability over these classes of problems. Examples of conditionally energy stable schemes are constructed and an example is given in which unconditional energy stability is obtained with an explicit scheme.
2019_entropyRRK:
  arxiv: '1905.09129'
  abstract: 'The framework of inner product norm preserving relaxation Runge-Kutta methods (David I. Ketcheson, \emph{Relaxation Runge-Kutta Methods: Conservation and Stability for Inner-Product Norms}, SIAM Journal on Numerical Analysis, 2019) is extended to general convex quantities. Conservation, dissipation, or other solution properties with respect to any convex functional are enforced by the addition of a {\em relaxation parameter} that multiplies the Runge-Kutta update at each step. Moreover, other desirable stability (such as strong stability preservation) and efficiency (such as low storage requirements) properties are preserved. The technique can be applied to both explicit and implicit Runge-Kutta methods and requires only a small modification to existing implementations. The computational cost at each step is the solution of one additional scalar algebraic equation for which a good initial guess is available. The effectiveness of this approach is proved analytically and demonstrated in several numerical examples, including applications to high-order entropy-conservative and entropy-stable semi-discretizations on unstructured grids for the compressible Euler and Navier-Stokes equations.'
2019_periodic:
  arxiv: '1909.04937'
  abstract: "Solutions of first-order nonlinear hyperbolic conservation laws typically develop shocks in finite time even with smooth initial conditions. However, in heterogeneous media with rapid spatial variation, shock formation may be delayed or avoided. When shocks do form in such media, their speed of propagation depends on the material structure. We investigate conditions for shock formation and propagation in heterogeneous media. We focus on the propagation of plane waves in two-dimensional periodic media with material variation in only one direction.\n  We propose an estimate for the speed of the shocks that is based on the Rankine-Hugoniot conditions applied to a leading-order homogenized (constant coefficient) system. We verify this estimate via numerical simulations using different nonlinear constitutive relations and layered and smoothly varying periodic media. In addition, we discuss conditions and regimes under which shocks form in this type of media."
