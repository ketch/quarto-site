rajvanshi2026efficient:
  arxiv: '2604.05940'
  abstract: We study relaxation-based approaches for conserving mass and energy in the numerical solution of Schrödinger-Poisson (SP) type systems. Relaxation-based methods offer a general approach that can be applied as post-time step processing to achieve conservation with any time-stepping scheme. Here we study two types of relaxation techniques applied to implicit-explicit Runge-Kutta schemes, with Fourier collocation in space. We also study SP equations with time-varying coefficients (which appear naturally in cosmology) where energy is not conserved but satisfies a balance equation. We show that the fully-discrete system conserves both mass and energy (or satisfies the balance equation in case of time-varying coefficients), up to rounding errors. The effectiveness of these methods is demonstrated via numerical examples, including a three-dimensional cosmological simulation.
ramirez2026compartmental:
  arxiv: '2610.01111'
  abstract: We propose and study a compartmental epidemiological model that incorporates both waning immunity and mutation-driven immune escape into a single-strain framework. The model, termed SIRCm, extends the SIRC (Susceptible-Infected-Recovered-Cross-immune) model, in which recovered individuals pass through an intermediate cross-immune class before returning to full susceptibility. In SIRCm, both the rate of immune waning and the rate of immune escape are amplified by a feedback function tied to the current level of infection. We study two formulations of this feedback, a transmission-driven model, in which mutation opportunities arise at the point of new infection, and a prevalence-driven model, in which they arise in proportion to the infected population alone. For both models and any feedback strength, we prove existence of an endemic equilibrium using persistence theory, and characterize its behavior analytically in the weak and strong-feedback limits, recovering the SIRC and SIS models, respectively, as limiting cases. Unlike the SIRC model, we show that the SIRCm endemic equilibrium is unstable in certain parameter regimes. This leads to novel behavior, even in the absence of seasonal forcing.
ranocha2020relaxation:
  arxiv: '2001.04826'
  abstract: The recently-introduced relaxation approach for Runge-Kutta methods can be used to enforce conservation of energy in the integration of Hamiltonian systems. We study the behavior of implicit and explicit relaxation Runge-Kutta methods in this context. We find that, in addition to their useful conservation property, the relaxation methods yield other improvements. Experiments show that their solutions bear stronger qualitative similarity to the true solution and that the error grows more slowly in time. We also prove that these methods are superconvergent for a certain class of Hamiltonian systems.
ranocha2021optimized:
  arxiv: '2104.06836'
  abstract: We develop error-control based time integration algorithms for compressible fluid dynamics (CFD) applications and show that they are efficient and robust in both the accuracy-limited and stability-limited regime. Focusing on discontinuous spectral element semidiscretizations, we design new controllers for existing methods and for some new embedded Runge-Kutta pairs. We demonstrate the importance of choosing adequate controller parameters and provide a means to obtain these in practice. We compare a wide range of error-control-based methods, along with the common approach in which step size control is based on the Courant-Friedrichs-Lewy (CFL) number. The optimized methods give improved performance and naturally adopt a step size close to the maximum stable CFL number at loose tolerances, while additionally providing control of the temporal error at tighter tolerances. The numerical examples include challenging industrial CFD applications.
ranocha2021rate:
  arxiv: '2102.07376'
  abstract: We study the numerical error in solitary wave solutions of nonlinear dispersive wave equations. A number of existing results for discretizations of solitary wave solutions of particular equations indicate that the error grows quadratically in time for numerical methods that do not conserve energy, but grows only linearly for conservative methods. We provide numerical experiments suggesting that this result extends to a very broad class of equations and numerical methods.
ranocha2025high:
  arxiv: '2510.14335'
  abstract: We propose a class of numerical methods for the nonlinear Schrödinger (NLS) equation that conserves mass and energy, is of arbitrarily high-order accuracy in space and time, and requires only the solution of a scalar algebraic equation per time step. We show that some existing spatial discretizations, including the popular Fourier spectral method, are in fact energy-conserving if one considers the appropriate form of the energy density. We develop a new relaxation-type approach for conserving multiple nonlinear functionals that is more efficient and robust for the NLS equation compared to the existing multiple-relaxation approach. The accuracy and efficiency of the new schemes is demonstrated on test problems for both the focusing and defocusing NLS.
ranocha2026conserving:
  arxiv: '2512.16352'
  abstract: We propose and study a class of arbitrarily high-order numerical discretizations that preserve multiple invariants and are essentially explicit (they do not require the solution of any large systems of algebraic equations). In space, we use Fourier Galerkin methods, while in time we use a combination of orthogonal projection and relaxation. We prove and numerically demonstrate the conservation properties of the method by applying it to the Benjamin-Bona-Mahony, Korteweg-de Vries, and nonlinear Schrödinger (NLS) PDEs as well as a hyperbolic approximation of NLS. For each of these equations, the proposed schemes conserve mass, momentum, and energy up to numerical precision. We show that this conservation leads to reduced growth of numerical errors for long-term simulations.
