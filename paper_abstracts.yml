2020_assessing:
  arxiv: null
  found_by: title search, nothing found 2026-11-22
  crossref: 10.12688/wellcomeopenres.15996.1
  abstract: \textbf{Background:} The assessment of the severity and case fatality rates of coronavirus disease 2019 (COVID-19) and the determinants of its variation is essential for planning health resources and responding to the pandemic. The interpretation of case fatality rates (CFRs) remains a challenge due to different biases associated with surveillance and reporting. For example, rates may be affected by preferential ascertainment of severe cases and time delay from disease onset to death. Using data from Spain, we demonstrate how some of these biases may be corrected when estimating severity and case fatality rates by age group and gender, and identify issues that may affect the correct interpretation of the results. \textbf{Methods:} Crude CFRs are estimated by dividing the total number of deaths by the total number of confirmed cases. CFRs adjusted for preferential ascertainment of severe cases are obtained by assuming a uniform attack rate in all population groups, and using demography-adjusted under-ascertainment rates. CFRs adjusted for the delay between disease onset and death are estimated by using as denominator the number of cases that could have a clinical outcome by the time rates are calculated. A sensitivity analysis is carried out to compare CFRs obtained using different levels of ascertainment and different distributions for the time from disease onset to death. \textbf{Results:} COVID-19 outcomes are highly influenced by age and gender. Different assumptions yield different CFR values but in all scenarios CFRs are higher in old ages and males. \textbf{Conclusions:} The procedures used to obtain the CFR estimates require strong assumptions and although the interpretation of their magnitude should be treated with caution, the differences observed by age and gender are fundamental underpinnings to inform decision-making.
2020_broad:
  arxiv: '2006.14802'
  abstract: 'We develop a general framework for designing conservative numerical methods based on summation by parts operators and split forms in space, combined with relaxation Runge-Kutta methods in time. We apply this framework to create new classes of fully-discrete conservative methods for several nonlinear dispersive wave equations: Benjamin-Bona-Mahony (BBM), Fornberg-Whitham, Camassa-Holm, Degasperis-Procesi, Holm-Hone, and the BBM-BBM system. These full discretizations conserve all linear invariants and one nonlinear invariant for each system. The spatial semidiscretizations include finite difference, spectral collocation, and both discontinuous and continuous finite element methods. The time discretization is essentially explicit, using relaxation Runge-Kutta methods. We implement some specific schemes from among the derived classes, and demonstrate their favorable properties through numerical tests.'
2020_conservative:
  arxiv: '2009.09641'
  abstract: The paper proposes a new, conservative fully-discrete scheme for the numerical solution of the regularised shallow water Boussinesq system of equations in the cases of periodic and reflective boundary conditions. The particular system is one of a class of equations derived recently and can be used in practical simulations to describe the propagation of weakly nonlinear and weakly dispersive long water waves, such as tsunamis. Studies of small-amplitude long waves usually require long-time simulations in order to investigate scenarios such as the overtaking collision of two solitary waves or the propagation of transoceanic tsunamis. For long-time simulations of non-dissipative waves such as solitary waves, the preservation of the total energy by the numerical method can be crucial in the quality of the approximation. The new conservative fully-discrete method consists of a Galerkin finite element method for spatial semidiscretisation and an explicit relaxation Runge--Kutta scheme for integration in time. The Galerkin method is expressed and implemented in the framework of mixed finite element methods. The paper provides an extended experimental study of the accuracy and convergence properties of the new numerical method. The experiments reveal a new convergence pattern compared to standard Galerkin methods.
