2015_diffractons:
  arxiv: '1312.4122'
  abstract: A new class of solitary waves arises in the solution of nonlinear wave equations with constant impedance and no dispersive terms. They depend on a balance between nonlinearity and a dispersion-like effect due to spatial variation in the sound speed of the medium. A high-order homogenized model confirms this effective dispersive behavior and its solutions agree well with those obtained by direct simulation of the variable-coefficient system. These waves are observed to be long-time stable, globally attracting solutions that arise in general as solutions to nonlinear wave problems with periodically-varying sound speed. They share some properties with known classes of solitary waves, but possess important differences as well.
2015_exponential_stability_regions:
  arxiv: '1312.0216'
  abstract: Certain numerical methods for initial value problems have as stability function the nth partial sum of the exponential function. We study the stability region, i.e., the set in the complex plane over which the nth partial sum has at most unit modulus. It is known that the asymptotic shape of the part of the stability region in the left half-plane is a semi-disk. We quantify this by providing disks that enclose or are enclosed by the stability region or its left half-plane part. The radius of the smallest disk centered at the origin that contains the stability region (or its portion in the left half-plane) is determined for $1\le n\le 20$. Bounds on such radii are proved for $n\ge 2$; these bounds are shown to be optimal in the limit $n\to +\infty$. We prove that the stability region and its complement, restricted to the imaginary axis, consist of alternating intervals of length tending to $π$, as $n\to\infty$. Finally, we prove that a semi-disk in the left half-plane with vertical boundary being the imaginary axis and centered at the origin is included in the stability region if and only if $n\equiv 0 \mod 4$ or $n\equiv 3\mod 4$. The maximal radii of such semi-disks are exactly determined for $1\le n\le 20$.
2015_practical_splitting:
  arxiv: '1604.01179'
  found_by: title search
  abstract: We present a number of new contributions to the topic of constructing efficient higher-order splitting methods for the numerical integration of evolution equations. Particular schemes are constructed via setup and solution of polynomial systems for the splitting coefficients. To this end we use and modify a recent approach for generating these systems for a large class of splittings. In particular, various types of pairs of schemes intended for use in adaptive integrators are constructed.
2016_clawpack:
  arxiv: null
  found_by: title search, nothing found 2026-11-22
  crossref: 10.7717/peerj-cs.68
  abstract: Clawpack is a software package designed to solve nonlinear hyperbolic partial differential equations using high-resolution finite volume methods based on Riemann solvers and limiters. The package includes a number of variants aimed at different applications and user communities. Clawpack has been actively developed as an open source project for over 20 years. The latest major release, Clawpack 5, introduces a number of new features and changes to the code base and a new development model based on GitHub and Git submodules. This article provides a summary of the most significant changes, the rationale behind some of these changes, and a description of our current development model.
2016_ssp_lmm_vss:
  arxiv: '1504.04107'
  abstract: Strong stability preserving (SSP) methods are designed primarily for time integration of nonlinear hyperbolic PDEs, for which the permissible SSP step size varies from one step to the next. We develop the first SSP linear multistep methods (of order two and three) with variable step size, and prove their optimality, stability, and convergence. The choice of step size for multistep SSP methods is an interesting problem because the allowable step size depends on the SSP coefficient, which in turn depends on the chosen step sizes. The description of the methods includes an optimal step-size strategy. We prove sharp upper bounds on the allowable step size for explicit SSP linear multistep methods and show the existence of methods with arbitrarily high order of accuracy. The effectiveness of the methods is demonstrated through numerical examples.
2017_dense:
  arxiv: '1605.02429'
  abstract: We investigate dense output formulae (also known as continuous extensions) for strong stability preserving (SSP) Runge-Kutta methods. We require that the dense output formula also possess the SSP property, ideally under the same step-size restriction as the method itself. A general recipe for first-order SSP dense output formulae for SSP methods is given, and second-order dense output formulae for several optimal SSP methods are developed. It is shown that SSP dense output formulae of order 3 and higher do not exist, and that in any method possessing a second-order SSP dense output, the coefficient matrix A has a zero row.
2017_msrk:
  arxiv: '1307.8058'
  abstract: High-order spatial discretizations with strong stability properties (such as monotonicity) are desirable for the solution of hyperbolic PDEs. Methods may be compared in terms of the strong stability preserving (SSP) time-step. We prove an upper bound on the SSP coefficient of explicit multistep Runge--Kutta methods of order two and above. Order conditions and monotonicity conditions for such methods are worked out in terms of the method coefficients. Numerical optimization is used to find optimized explicit methods of up to five steps, eight stages, and tenth order. These methods are tested on the advection and Buckley-Leverett equations, and the results for the observed total variation diminishing and positivity preserving time-step are presented.
2018_positivity:
  arxiv: '1610.00228'
  abstract: We propose a technique for investigating stability properties like positivity and forward invariance of an interval for method-of-lines discretizations, and apply the technique to study positivity preservation for a class of TVD semi-discretizations of 1D scalar hyperbolic conservation laws. This technique is a generalization of the approach suggested in ref. 12. We give more relaxed conditions on the time-step for positivity preservation for slope-limited semi-discretizations integrated in time with explicit Runge-Kutta methods. We show that the step-size restrictions derived are sharp in a certain sense, and that many higher-order explicit Runge-Kutta methods, including the classical 4th-order method and all non-confluent methods with a negative Butcher coefficient, cannot generally maintain positivity for these semi-discretizations under any positive step size. We also apply the proposed technique to centered finite difference discretizations of scalar hyperbolic and parabolic problems.
2018_sspalmm:
  arxiv: '1601.03637'
  abstract: The analysis of strong-stability-preserving (SSP) linear multistep methods is extended to semi-discretized problems for which different terms on the right-hand side satisfy different forward Euler (or circle) conditions. Optimal additive and perturbed monotonicity-preserving linear multistep methods are studied in the context of such problems. Optimal perturbed methods attain larger monotonicity-preserving step sizes when the different forward Euler conditions are taken into account. On the other hand, we show that optimal SSP additive methods achieve a monotonicity-preserving step-size restriction no better than that of the corresponding non-additive SSP linear multistep methods.
