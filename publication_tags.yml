# Extra data for build_publications.py, keyed by BibTeX citation key.
#
# tags: topic tags used by the filter buttons on the publications page
#   (time-integration, periodic-media, hyperbolic, ssp, runge-kutta, epidemiology).
#   These are added to any `keywords` already in the .bib entry.
#   Tags below were assigned by Claude from each paper's arXiv abstract;
#   entries marked "check" were borderline calls.
#
# doi_labels: link text to use in place of "Published version" for a DOI
#   that points to a preprint server rather than a journal.
#
# abstract_overrides: abstracts to use in place of the .bib (or arXiv)
#   abstract on the paper's supplementary page, for entries whose abstract is
#   malformed.  Remove an override once the .bib entry is fixed.
#
# repos: reproducibility repositories, for papers not listed with one in the
#   Jekyll site's paperlinks.txt.  null hides a paperlinks.txt repository
#   (e.g. a dead link) from the paper's supplementary page.
#
# title_overrides: replacement titles for entries whose .bib title is
#   malformed.  Remove an override once the .bib entry is fixed.

